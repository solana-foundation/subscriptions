packages:
  - 'clients/*'
  - 'webapp'
  - 'webapp/api'
  - 'webapp/scripts'

allowBuilds:
  bigint-buffer: false
  bufferutil: false
  esbuild: true
  unrs-resolver: true
  utf-8-validate: false

minimumReleaseAgeExclude:
  - '@codama/renderers-rust@3.1.1 || 3.1.3'
  - '@solana/surfpool-darwin-arm64@1.5.0'
  - '@solana/surfpool-darwin-x64@1.5.0'
  - '@solana/surfpool-linux-x64-gnu@1.5.0'
  - '@solana/surfpool@1.5.0'

overrides:
  bn.js: 5.2.3
  flatted: 3.4.2
  minimatch: 9.0.9
  picomatch: 4.0.4
  rollup: 4.60.2
  shell-quote: 1.11.0
  source-map-js: 1.2.2
  ws@^8.0.0: 8.20.1
