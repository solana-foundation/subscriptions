packages:
  - 'clients/*'
  - 'webapp'
  - 'webapp/api'
  - 'webapp/scripts'

auditConfig:
  ignoreGhsas:
    - GHSA-3gc7-fjrx-p6mg
    - GHSA-gcqx-w48m-w2h4

allowBuilds:
  bigint-buffer: false
  bufferutil: false
  esbuild: true
  unrs-resolver: true
  utf-8-validate: false

minimumReleaseAgeExclude:
  - '@codama/renderers-rust@3.1.1 || 3.1.3'
  - '@solana/surfpool-darwin-arm64@1.5.0'
  - '@solana/surfpool-darwin-x64@1.5.0'
  - '@solana/surfpool-linux-x64-gnu@1.5.0'
  - '@solana/surfpool@1.5.0'

overrides:
  bn.js: 5.2.3
  esbuild: 0.28.2
  flatted: 3.4.2
  image-size: 2.0.4
  jayson: 5.0.0
  minimatch: 9.0.9
  picomatch: 4.0.4
  rollup: 4.60.2
  shell-quote: 1.11.0
  source-map-js: 1.2.2
  uuid: 11.1.1
  ws@^8.0.0: 8.22.0
