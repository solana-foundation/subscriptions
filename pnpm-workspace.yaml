packages:
  - 'clients/*'
  - 'webapp'
  - 'webapp/api'
  - 'webapp/scripts'

auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4

allowBuilds:
  bufferutil: false
  esbuild: true
  unrs-resolver: true
  utf-8-validate: false

minimumReleaseAgeExclude:
  - '@codama/renderers-rust@3.1.1 || 3.1.3'

overrides:
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@<11.0.1: ^11.0.1
