packages:
  - 'clients/*'
  - 'webapp'
  - 'webapp/api'
  - 'webapp/scripts'

auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4

allowBuilds:
  bufferutil: false
  esbuild: true
  unrs-resolver: true
  utf-8-validate: false

minimumReleaseAgeExclude:
